[project]
name = "bqg-video"
version = "1.0.0"
description = "Xưởng Video A.I Bình Quân — dựng video ngắn từ cảnh máy chạy thật của Bình Quân Group"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["bqgvideo"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
bqgvideo = "bqgvideo.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
